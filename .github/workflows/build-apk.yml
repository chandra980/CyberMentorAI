name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'assistant_prompt.txt'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - run: gradle :app:assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk ../CyberMentorAI-Android-debug.apk
      - name: Verify APK signature and metadata
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose ../CyberMentorAI-Android-debug.apk
          "$AAPT" dump badging ../CyberMentorAI-Android-debug.apk | tee /tmp/apk-badging.txt
          grep -q "package: name='ai.cybermentor.mobile'" /tmp/apk-badging.txt
          grep -q "application-label:'CyberMentor AI'" /tmp/apk-badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CyberMentorAI-Android-debug
          path: CyberMentorAI-Android-debug.apk
          if-no-files-found: error
