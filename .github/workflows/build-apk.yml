name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'assistant_prompt.txt'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - run: gradle :app:assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk ../CyberMentorAI-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CyberMentorAI-Android-debug
          path: CyberMentorAI-Android-debug.apk
          if-no-files-found: error
