name: Publish Installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'desktop/**'
      - 'cli/**'
      - 'backend/**'
      - 'installer/**'
      - 'scripts/**'
      - 'assets/**'
      - 'assistant_prompt.txt'
      - '.github/workflows/publish-release.yml'

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Configure Android release signing
        if: env.ANDROID_KEYSTORE_B64 != ''
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/android-app/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/android-app/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_SIGNING=1" >> "$GITHUB_ENV"
      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd android-app
          if [ "${ANDROID_RELEASE_SIGNING:-0}" = "1" ]; then
            gradle :app:assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ../CyberMentorAI-Android.apk
          else
            gradle :app:assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../CyberMentorAI-Android.apk
          fi
      - name: Verify release APK
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose CyberMentorAI-Android.apk
          "$AAPT" dump badging CyberMentorAI-Android.apk | tee /tmp/apk-badging.txt
          grep -q "package: name='ai.cybermentor.mobile'" /tmp/apk-badging.txt
          grep -q "application-label:'CyberMentor AI'" /tmp/apk-badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-Android
          path: CyberMentorAI-Android.apk
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_CERT_PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller customtkinter keyring pillow
      - name: Generate branding assets
        run: python scripts/generate_branding.py
      - name: Build desktop GUI on Windows
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --collect-all keyring --icon assets/CyberMentorAI.ico --version-file assets/windows_version_info.txt --name CyberMentorAI desktop/gui.py
      - name: Build desktop GUI on non-Windows
        if: runner.os != 'Windows'
        run: pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --collect-all keyring --name CyberMentorAI desktop/gui.py
      - name: Build CLI
        run: pyinstaller --noconfirm --onefile --name cybermentor cli/cybermentor.py
      - name: Build optional backend
        run: pyinstaller --noconfirm --onefile --name cybermentor-backend backend/server.py
      - name: Smoke-test packaged Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gui=Start-Process .\dist\CyberMentorAI.exe -ArgumentList "--self-test" -PassThru -Wait
          if ($gui.ExitCode -ne 0) { throw "Desktop self-test failed with exit code $($gui.ExitCode)" }
          $cli=Start-Process .\dist\cybermentor.exe -ArgumentList "--self-test" -PassThru -Wait -NoNewWindow
          if ($cli.ExitCode -ne 0) { throw "CLI self-test failed with exit code $($cli.ExitCode)" }
          $env:PORT="18787"
          $p=Start-Process .\dist\cybermentor-backend.exe -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2
            $health=Invoke-RestMethod -Uri "http://127.0.0.1:18787/api/health" -TimeoutSec 10
            if (-not $health.ok) { throw "Backend health check failed" }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Smoke-test packaged Unix binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x dist/CyberMentorAI dist/cybermentor dist/cybermentor-backend
          dist/CyberMentorAI --self-test
          dist/cybermentor --self-test
          PORT=18787 dist/cybermentor-backend >/tmp/cybermentor-backend.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 2
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:18787/api/health",timeout=10) as r:
              d=json.loads(r.read())
          assert d.get("ok") is True,d
          print("Packaged backend health OK")
          PY
      - name: Sign Windows application binaries
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX_B64 != ''
        shell: pwsh
        run: |
          $cert = Join-Path $env:RUNNER_TEMP "cybermentor-signing.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_B64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          foreach ($file in @("dist\CyberMentorAI.exe","dist\cybermentor.exe","dist\cybermentor-backend.exe")) {
            & $signtool.FullName sign /fd SHA256 /f $cert /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $file
          }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\CyberMentorAI.iss
      - name: Sign Windows installer
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX_B64 != ''
        shell: pwsh
        run: |
          $cert = Join-Path $env:RUNNER_TEMP "cybermentor-signing.pfx"
          if (-not (Test-Path $cert)) {
            [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_B64))
          }
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool.FullName sign /fd SHA256 /f $cert /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "installer\output\CyberMentorAI-Setup-Windows.exe"
      - name: Smoke-test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDir=Join-Path $env:RUNNER_TEMP "CyberMentorInstalled"
          $p=Start-Process "installer\output\CyberMentorAI-Setup-Windows.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$installDir" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer returned exit code $($p.ExitCode)" }
          $app=Join-Path $installDir "CyberMentorAI.exe"
          if (-not (Test-Path $app)) { throw "Installed app executable not found" }
          $installed=Start-Process $app -ArgumentList "--self-test" -PassThru -Wait
          if ($installed.ExitCode -ne 0) { throw "Installed app self-test failed with exit code $($installed.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            dist/*
            installer/output/*
          if-no-files-found: error

  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
          pattern: release-*
      - name: Normalize release filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          pick() { find "$1" -type f -name "$2" -print -quit; }
          cp "$(pick downloaded/release-Android 'CyberMentorAI-Android.apk')" release-assets/CyberMentorAI-Android.apk
          cp "$(pick downloaded/release-Windows 'CyberMentorAI.exe')" release-assets/CyberMentorAI-Windows.exe
          cp "$(pick downloaded/release-Windows 'cybermentor.exe')" release-assets/cybermentor-Windows.exe
          cp "$(pick downloaded/release-Windows 'cybermentor-backend.exe')" release-assets/cybermentor-backend-Windows.exe
          cp "$(pick downloaded/release-Windows 'CyberMentorAI-Setup-Windows.exe')" release-assets/CyberMentorAI-Setup-Windows.exe
          cp "$(pick downloaded/release-Linux 'CyberMentorAI')" release-assets/CyberMentorAI-Linux
          cp "$(pick downloaded/release-Linux 'cybermentor')" release-assets/cybermentor-Linux
          cp "$(pick downloaded/release-Linux 'cybermentor-backend')" release-assets/cybermentor-backend-Linux
          cp "$(pick downloaded/release-macOS 'CyberMentorAI')" release-assets/CyberMentorAI-macOS
          cp "$(pick downloaded/release-macOS 'cybermentor')" release-assets/cybermentor-macOS
          cp "$(pick downloaded/release-macOS 'cybermentor-backend')" release-assets/cybermentor-backend-macOS
          test -s release-assets/CyberMentorAI-Android.apk
          test -s release-assets/CyberMentorAI-Windows.exe
          test -s release-assets/CyberMentorAI-Setup-Windows.exe
          chmod +x release-assets/CyberMentorAI-Linux release-assets/cybermentor-Linux release-assets/cybermentor-backend-Linux || true
          chmod +x release-assets/CyberMentorAI-macOS release-assets/cybermentor-macOS release-assets/cybermentor-backend-macOS || true
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Publish latest-only GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          TAG="v3.3.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release-assets/* \
            --title "CyberMentor AI $TAG" \
            --notes "Current supported release by Chandra Kumar Yadav. Includes Android APK, one-click Windows installer, desktop GUI, CLI and optional backend binaries. Older CyberMentor releases are removed automatically." \
            --target "${GITHUB_SHA}"
          for OLD in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            if [ "$OLD" != "$TAG" ]; then
              gh release delete "$OLD" --cleanup-tag --yes || true
            fi
          done
