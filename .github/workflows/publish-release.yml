name: Publish Installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'desktop/**'
      - 'cli/**'
      - 'backend/**'
      - 'installer/**'
      - 'assistant_prompt.txt'
      - '.github/workflows/publish-release.yml'
permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Build APK
        run: |
          cd android-app
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../CyberMentorAI-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-Android
          path: CyberMentorAI-Android.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pyinstaller customtkinter keyring
      - run: pyinstaller --noconfirm --onefile --windowed --name CyberMentorAI desktop/gui.py
      - run: pyinstaller --noconfirm --onefile --name cybermentor cli/cybermentor.py
      - run: pyinstaller --noconfirm --onefile --name cybermentor-backend backend/server.py
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\CyberMentorAI.iss
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            dist/*
            installer/output/*

  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
          pattern: release-*
      - name: Normalize release filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp downloaded/release-Android/CyberMentorAI-Android.apk release-assets/CyberMentorAI-Android.apk
          cp downloaded/release-Windows/CyberMentorAI.exe release-assets/CyberMentorAI-Windows.exe
          cp downloaded/release-Windows/cybermentor.exe release-assets/cybermentor-Windows.exe
          cp downloaded/release-Windows/cybermentor-backend.exe release-assets/cybermentor-backend-Windows.exe
          cp downloaded/release-Windows/CyberMentorAI-Setup-Windows.exe release-assets/CyberMentorAI-Setup-Windows.exe
          cp downloaded/release-Linux/CyberMentorAI release-assets/CyberMentorAI-Linux
          cp downloaded/release-Linux/cybermentor release-assets/cybermentor-Linux
          cp downloaded/release-Linux/cybermentor-backend release-assets/cybermentor-backend-Linux
          cp downloaded/release-macOS/CyberMentorAI release-assets/CyberMentorAI-macOS
          cp downloaded/release-macOS/cybermentor release-assets/cybermentor-macOS
          cp downloaded/release-macOS/cybermentor-backend release-assets/cybermentor-backend-macOS
          chmod +x release-assets/CyberMentorAI-Linux release-assets/cybermentor-Linux release-assets/cybermentor-backend-Linux || true
          chmod +x release-assets/CyberMentorAI-macOS release-assets/cybermentor-macOS release-assets/cybermentor-backend-macOS || true
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Create GitHub Release
        shell: bash
        run: |
          TAG="v3.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release-assets/*             --title "CyberMentor AI $TAG"             --notes "Automatic multiplatform build from commit ${GITHUB_SHA}. Includes Android APK, one-click Windows installer, desktop GUI, CLI and backend binaries. Android installation requires user approval. Cloud AI providers may require their own credentials or backend configuration."             --target "${GITHUB_SHA}"
