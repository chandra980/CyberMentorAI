name: Android 10-16 Launch Matrix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-compat.yml'

concurrency:
  group: android-compat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        shell: bash
        run: |
          cd android-app
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../CyberMentorAI-compat.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-compat-apk
          path: CyberMentorAI-compat.apk
          if-no-files-found: error

  launch-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 30, 31, 33, 34, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-compat-apk
          path: .
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch smoke test on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -e
            adb wait-for-device
            adb install -r CyberMentorAI-compat.apk
            adb logcat -c
            adb shell am force-stop ai.cybermentor.mobile
            adb shell am start -W -n ai.cybermentor.mobile/.MainActivity
            sleep 8
            PID="$(adb shell pidof ai.cybermentor.mobile | tr -d '\r')"
            if [ -z "$PID" ]; then
              echo "CyberMentor process died after launch on API ${{ matrix.api-level }}"
              adb logcat -d
              exit 1
            fi
            adb shell dumpsys activity activities | grep -q "ai.cybermentor.mobile/.MainActivity"
            if adb logcat -d | grep -E "FATAL EXCEPTION: main|Process: ai.cybermentor.mobile" | grep -q "ai.cybermentor.mobile"; then
              echo "Fatal exception detected on API ${{ matrix.api-level }}"
              adb logcat -d
              exit 1
            fi
            echo "CyberMentor launch stable on API ${{ matrix.api-level }}, pid=$PID"
