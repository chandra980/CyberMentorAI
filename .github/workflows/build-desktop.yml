name: Build Desktop and CLI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'cli/**'
      - 'backend/**'
      - 'assistant_prompt.txt'
      - '.github/workflows/build-desktop.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pyinstaller customtkinter keyring pillow
      - name: Generate branding assets
        run: python scripts/generate_branding.py
      - name: Build desktop GUI on Windows
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --collect-all keyring --icon assets/CyberMentorAI.ico --version-file assets/windows_version_info.txt --name CyberMentorAI desktop/gui.py
      - name: Build desktop GUI on non-Windows
        if: runner.os != 'Windows'
        run: pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --collect-all keyring --name CyberMentorAI desktop/gui.py
      - run: pyinstaller --noconfirm --onefile --name cybermentor cli/cybermentor.py
      - run: pyinstaller --noconfirm --onefile --name cybermentor-backend backend/server.py
      - name: Smoke-test packaged Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gui=Start-Process .\dist\CyberMentorAI.exe -ArgumentList "--self-test" -PassThru -Wait
          if ($gui.ExitCode -ne 0) { throw "Desktop self-test failed with exit code $($gui.ExitCode)" }
          $cli=Start-Process .\dist\cybermentor.exe -ArgumentList "--self-test" -PassThru -Wait -NoNewWindow
          if ($cli.ExitCode -ne 0) { throw "CLI self-test failed with exit code $($cli.ExitCode)" }
          $env:PORT="18787"
          $p=Start-Process .\dist\cybermentor-backend.exe -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2
            $health=Invoke-RestMethod -Uri "http://127.0.0.1:18787/api/health" -TimeoutSec 10
            if (-not $health.ok) { throw "Backend health check failed" }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Smoke-test packaged Unix binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x dist/CyberMentorAI dist/cybermentor dist/cybermentor-backend
          dist/CyberMentorAI --self-test
          dist/cybermentor --self-test
          PORT=18787 dist/cybermentor-backend >/tmp/cybermentor-backend.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 2
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:18787/api/health",timeout=10) as r:
              d=json.loads(r.read())
          assert d.get("ok") is True,d
          print("Packaged backend health OK")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CyberMentorAI-${{ runner.os }}
          path: dist/*
