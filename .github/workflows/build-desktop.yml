name: Build Desktop and CLI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'cli/**'
      - 'backend/**'
      - 'assistant_prompt.txt'
      - '.github/workflows/build-desktop.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name CyberMentorAI desktop/gui.py
      - run: pyinstaller --noconfirm --onefile --name cybermentor cli/cybermentor.py
      - run: pyinstaller --noconfirm --onefile --name cybermentor-backend backend/server.py
      - uses: actions/upload-artifact@v4
        with:
          name: CyberMentorAI-${{ runner.os }}
          path: dist/*
