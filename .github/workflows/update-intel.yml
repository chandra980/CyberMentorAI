name: Update Cybersecurity Intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: '27 2 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_cyber_feed.py
      - name: Commit feed changes
        run: |
          git config user.name "cybermentor-bot"
          git config user.email "cybermentor-bot@users.noreply.github.com"
          git add data/cyber_feed.json
          git diff --cached --quiet || git commit -m "chore: refresh cybersecurity intelligence"
          git push
